[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "prompt-enhance-backend"
version = "0.1.0"
description = "Prompt Enhance API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "google-genai>=1.42,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "snowflake-connector-python>=4,<5",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.27,<1", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"../database/migrations" = "app/db/sql"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a real PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 110
